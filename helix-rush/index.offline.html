<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<meta name="robots" content="noindex,nofollow,noarchive">
	<meta name="theme-color" content="#07090e">
	<title>Helix Rush — Offline</title>
	<style>
		:root { color-scheme: dark; font-family: system-ui, sans-serif; }
		body { display: grid; min-height: 100vh; margin: 0; place-items: center; background: #07090e; color: #f6f8ff; }
		main { box-sizing: border-box; width: min(34rem, 90vw); padding: 2rem; border: 1px solid #34445f; border-radius: 1rem; background: #101726; text-align: center; }
		h1 { margin: 0 0 .75rem; color: #63f59a; font-size: clamp(1.8rem, 7vw, 3rem); letter-spacing: .04em; }
		p { margin: .5rem 0; color: #c4ccdc; line-height: 1.5; }
		button { margin-top: 1.25rem; padding: .75rem 1.1rem; border: 0; border-radius: .6rem; background: #63f59a; color: #07120b; font: inherit; font-weight: 750; cursor: pointer; }
	</style>
</head>
<body>
	<main>
		<h1>HELIX RUSH</h1>
		<p>This playtest build is not available offline yet.</p>
		<p>Reconnect once so the browser can finish caching the game, then reload.</p>
		<button type="button" onclick="location.reload()">Try again</button>
	</main>
</body>
</html>
